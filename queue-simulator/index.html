<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Data Structure Simulator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.3.min.js" integrity="sha256-pvPw+upLPUjgMXY0G+8O0xUf+/Im1MZjXxxgOcBQBXU=" crossorigin="anonymous"></script>
    <script src="queue.js"></script>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="container col-sm-6">
        <div class="row">
            <h1 class="display-7 p-3 mb-1 text-center text-bg-dark">Queue Data Structure Simulator</h1>
        </div>
        <div class="row text-bg-success p-3 mb-1">
            <div class="col text-center fs-4">Operations</div>
            <div class="col text-center fs-4">Queue Data</div>
            <div class="col text-center fs-4">Deleted from Queue</div>
        </div>
        <div class="row bg-danger">
            <div class="col bg-7B8FA1">
                <div class="d-grid gap-1 col mx-auto">
                    <input type="text" id="q_data" class="form-control text-center mt-2" placeholder="data" aria-label="Queue data">
                    <button id="btn_enqueue" class="btn btn-success" type="button">Enqueue</button>
                    <button id="btn_dequeue" class="btn btn-danger" type="button">Dequeue</button>
                    <button id="btn_peek" class="btn btn-warning" type="button">Peek</button>
                    <button id="btn_clear" class="btn btn-light" type="button">Clear</button>
                    <p id="message" class="small text-white text-center mt-2" role="status" aria-live="polite">First In, First Out (FIFO)</p>
                </div>
            </div>
            <div class="col bg-dark">
                <div class="queue-label">FRONT (oldest)<span id="front_value">Empty</span></div>
                <div id="queue" class="d-flex flex-column justify-content-start"></div>
                <div class="queue-label">REAR (newest)<span id="rear_value">Empty</span></div>
            </div>
            <div id="dequeued" class="col dequeued bg-9C254D"></div>
        </div>
    </div>
</body>
</html>
